<!DOCTYPE html>
<!--
  Та же самая структура HTML, что и в версии 01-vanilla-js.
  HTML практически не изменился — jQuery влияет только на JavaScript,
  не на разметку. Это важный принцип: HTML = структура, JS = поведение.

  Изменения по сравнению с версией 01:
  1. Заголовок страницы и подпись версии обновлены
  2. Вместо нашего main.js подключаем сначала jQuery, потом наш файл
  3. Сам HTML абсолютно идентичен — потому что jQuery меняет только КАК
     мы работаем с DOM, а не КАК устроена страница.
-->
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента постов — jQuery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1 class="app-title">📝 Лента постов</h1>
    <p class="app-subtitle">Версия 2: jQuery (библиотека для работы с DOM)</p>

    <!-- ===== ФОРМА ДОБАВЛЕНИЯ ПОСТА ===== -->
    <form id="post-form" class="post-form">
      <input
        type="text"
        id="post-title"
        class="form-input"
        placeholder="Заголовок поста"
        required
      >
      <textarea
        id="post-body"
        class="form-textarea"
        placeholder="О чём хотите написать?"
        rows="3"
        required
      ></textarea>
      <button type="submit" class="btn btn-primary">
        Опубликовать
      </button>
    </form>

    <!-- ===== КОНТЕЙНЕР ДЛЯ ЛЕНТЫ ПОСТОВ ===== -->
    <div id="posts-container" class="posts-container"></div>

    <!-- ===== СООБЩЕНИЕ-ЗАГЛУШКА ===== -->
    <p id="empty-message" class="empty-message">
      Пока нет ни одного поста. Напишите первый! ✍️
    </p>

  </div>

  <!--
    КЛЮЧЕВОЕ ОТЛИЧИЕ ОТ ВЕРСИИ 01: подключение jQuery.

    jQuery подключается ПЕРЕД нашим скриптом — это обязательно!
    Наш main.js использует jQuery-функции, поэтому jQuery должен
    загрузиться первым. Порядок подключения скриптов = порядок выполнения.

    Мы подключаем jQuery из CDN (Content Delivery Network) — это сеть
    серверов по всему миру, которые раздают файлы. Это быстрее и удобнее,
    чем скачивать jQuery к себе в проект.

    Что такое CDN?
    Когда пользователь открывает сайт, браузер скачивает jQuery
    с ближайшего сервера сети (например, в Москве). Это быстро.
    Раньше CDN давал ещё один плюс: если jQuery уже скачался на ДРУГОМ
    сайте, браузер брал его из общего кеша. С 2020 года браузеры
    (Chrome, Firefox, Safari) делят кеш по сайтам ради приватности,
    поэтому этот бонус больше не работает. Остались скорость и удобство.

    В реальных проектах сейчас предпочитают npm install jquery
    и собирать через Webpack/Vite. Но CDN — быстрый способ попробовать.
  -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!--
    jquery-3.7.1.min.js — что значат эти части имени?
    — 3.7.1 — версия (major.minor.patch — семантическое версионирование)
    — .min — "минифицированная" версия: пробелы и переносы убраны,
      переменные сокращены. Весит меньше, но нечитабельна для человека.
      Для разработки можно использовать jquery-3.7.1.js (читаемый вариант).
  -->

  <script src="main.js"></script>

</body>
</html>
