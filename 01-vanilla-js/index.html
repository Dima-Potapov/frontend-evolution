<!DOCTYPE html>
<!--
  <!DOCTYPE html> — это "объявление типа документа" (Document Type Declaration).
  Оно говорит браузеру: "этот файл написан на HTML5".
  Без него браузер может перейти в "режим совместимости" (quirks mode)
  и отображать страницу по старым, непредсказуемым правилам.
  Всегда ставь его ПЕРВОЙ строкой в HTML-файле.
-->
<html lang="ru">
<!--
  <html> — корневой (самый верхний) элемент всей страницы.
  Атрибут lang="ru" подсказывает браузеру и поисковым системам,
  что содержимое страницы на русском языке.
  Это важно для: автоперевода, SEO, скринридеров (программы для слабовидящих).
-->

<head>
  <!--
    <head> — "голова" документа. Здесь находится мета-информация:
    заголовок вкладки, подключение стилей, кодировка и т.д.
    Содержимое <head> НЕ отображается на самой странице.
  -->

  <meta charset="UTF-8">
  <!--
    <meta charset="UTF-8"> — указывает кодировку символов.
    UTF-8 поддерживает кириллицу, эмодзи и почти все языки мира.
    Без этой строки русские буквы могут превратиться в "кракозябры".
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Этот мета-тег нужен для мобильных устройств.
    width=device-width — ширина страницы = ширина экрана устройства.
    initial-scale=1.0 — начальный масштаб 100% (без увеличения/уменьшения).
    Без него на телефоне страница будет выглядеть как уменьшенная десктопная версия.
  -->

  <title>Лента постов — Vanilla JS</title>
  <!--
    <title> — текст, который отображается на вкладке браузера.
    Также используется поисковиками как заголовок в результатах поиска.
  -->

  <link rel="stylesheet" href="style.css">
  <!--
    <link rel="stylesheet"> — подключает внешний CSS-файл.
    href="style.css" — путь к файлу (в нашем случае он лежит рядом с index.html).
    
    Почему стили в отдельном файле, а не внутри <style>?
    — Разделение ответственности: HTML отвечает за СТРУКТУРУ, CSS — за ВНЕШНИЙ ВИД.
    — Отдельный файл можно переиспользовать на других страницах.
    — Браузер кеширует CSS-файл, и при повторном визите страница загрузится быстрее.
  -->
</head>

<body>
  <!--
    <body> — "тело" документа. Здесь находится всё,
    что пользователь ВИДИТ на странице: текст, кнопки, формы, картинки.
  -->

  <div class="app">
    <!--
      <div> — универсальный блочный контейнер. Сам по себе ничего не значит,
      но позволяет группировать элементы и стилизовать их вместе.
      class="app" — CSS-класс, по которому мы найдём этот элемент в стилях.
      Мы оборачиваем всё приложение в один контейнер, чтобы:
      — задать максимальную ширину и отцентрировать на широких экранах
      — применить общие отступы
    -->

    <h1 class="app-title">📝 Лента постов</h1>
    <!--
      <h1> — заголовок первого (самого высокого) уровня.
      На странице должен быть только ОДИН <h1> — это главный заголовок.
      Поисковые системы используют его для понимания темы страницы.
    -->

    <p class="app-subtitle">Версия 1: чистый HTML + CSS + JavaScript (без фреймворков)</p>
    <!--
      <p> — параграф (абзац текста). Используется для обычного текста.
    -->

    <!-- ===== ФОРМА ДОБАВЛЕНИЯ ПОСТА ===== -->
    <form id="post-form" class="post-form">
      <!--
        <form> — HTML-элемент формы.
        id="post-form" — уникальный идентификатор. В отличие от class,
        id должен быть ЕДИНСТВЕННЫМ на странице. Мы используем его в JS
        для поиска этого конкретного элемента через getElementById.
        
        Почему <form>, а не просто <div> с инпутами?
        — Семантика: браузер понимает, что это форма для ввода данных.
        — Доступность: скринридеры объявляют "форма" пользователю.
        — Встроенное поведение: нажатие Enter в поле отправляет форму.
        — Валидация: атрибут required на полях работает автоматически.
      -->

      <input
        type="text"
        id="post-title"
        class="form-input"
        placeholder="Заголовок поста"
        required
      >
      <!--
        <input type="text"> — однострочное текстовое поле.
        id="post-title" — чтобы найти его в JS и получить введённое значение.
        placeholder="..." — подсказка внутри поля (исчезает при вводе).
        required — HTML5-валидация: форма не отправится, пока поле пустое.
        Браузер сам покажет сообщение "Заполните это поле" — без единой строки JS!
      -->

      <textarea
        id="post-body"
        class="form-textarea"
        placeholder="О чём хотите написать?"
        rows="3"
        required
      ></textarea>
      <!--
        <textarea> — многострочное текстовое поле (в отличие от <input>).
        rows="3" — начальная высота в строках.
        Обрати внимание: <textarea> — это ПАРНЫЙ тег (имеет закрывающий </textarea>),
        а <input> — ОДИНОЧНЫЙ (самозакрывающийся).
      -->

      <button type="submit" class="btn btn-primary">
        Опубликовать
      </button>
      <!--
        <button type="submit"> — кнопка отправки формы.
        type="submit" — при нажатии сработает событие "submit" на форме.
        
        Почему type="submit", а не onclick?
        — submit ловит и клик по кнопке, И нажатие Enter в любом поле.
        — Это стандартное поведение формы, не нужен лишний JS.
      -->
    </form>

    <!-- ===== КОНТЕЙНЕР ДЛЯ ЛЕНТЫ ПОСТОВ ===== -->
    <div id="posts-container" class="posts-container">
      <!--
        Сюда JavaScript будет динамически добавлять карточки постов.
        Изначально он пуст — посты появятся после того, как пользователь
        что-то напишет и нажмёт "Опубликовать".
        
        id="posts-container" — чтобы JS мог найти этот контейнер
        и вставлять в него новые элементы.
      -->
    </div>

    <!-- ===== СООБЩЕНИЕ-ЗАГЛУШКА (когда постов нет) ===== -->
    <p id="empty-message" class="empty-message">
      Пока нет ни одного поста. Напишите первый! ✍️
    </p>
    <!--
      Это сообщение видно, когда лента пуста.
      JS будет прятать его, когда появятся посты,
      и показывать обратно, когда все посты удалены.
    -->
  </div>

  <script src="main.js"></script>
  <!--
    <script src="main.js"> — подключает внешний JavaScript-файл.
    
    ВАЖНО: скрипт стоит В КОНЦЕ <body>, а не в <head>. Почему?
    — К моменту выполнения скрипта все HTML-элементы уже созданы (распарсены).
    — Если поставить в <head>, скрипт попытается найти элементы,
      которых ещё нет на странице → получим null → ошибка.
    — Альтернатива: атрибут defer в <head>, но для учебного проекта
      проще поставить скрипт внизу — это нагляднее.
  -->
</body>
</html>
