<!-- [class.confirming]="..." — переключение одного CSS-класса по условию -->
<article class="card" [class.confirming]="confirmDelete()">
  <h2 class="card-title">{{ post().title }}</h2>
  <p class="card-body">{{ post().body }}</p>
  <time class="card-meta" [attr.datetime]="post().createdAt">
    {{ post().createdAt | date: 'd MMM, HH:mm' }}
  </time>

  <div class="actions">
    @if (confirmDelete()) {
      <span class="question">Удалить этот пост?</span>
      <button type="button" class="btn btn-danger" (click)="confirm()">Подтвердить</button>
      <button type="button" class="btn" (click)="confirmDelete.set(false)">Отмена</button>
    } @else {
      <button type="button" class="btn btn-like" [class.liked]="isLiked()" (click)="like.emit(post().id)">
        ❤️ {{ post().likes }}
      </button>
      <button type="button" class="btn btn-delete" (click)="confirmDelete.set(true)">🗑️ Удалить</button>
    }
  </div>
</article>
